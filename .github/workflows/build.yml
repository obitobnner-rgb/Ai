name: Build Happy AI
on: [push]
jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v3
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install buildozer cython==0.29.33 virtualenv setuptools
    - name: Configure Buildozer
      run: |
        yes | buildozer init
        sed -i 's/title = My Application/title = Happy AI/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = happyai/' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests/' buildozer.spec
        sed -i 's/# p4a.branch = master/p4a.branch = master/g' buildozer.spec
    - name: Build APK
      run: buildozer android debug
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: HappyAI-APK
        path: bin/*.apk
        
