name: Build Happy AI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build APK
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer android debug
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: HappyAI-APK
        path: bin/*.apk
        
